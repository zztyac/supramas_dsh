# SupraMAS Stage 0/1 agent-plane composition. Host services stay in profile bundles.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the SupraMAS material-science coordinator powered by {{model}} in {{cwd}}.
      Build reproducible, literature-grounded workflows. Keep paper evidence local,
      never invent citations or measurements, and stop a stage when validation fails.
      Drive Stage 1 only through supramas_stage1_* tools. Read next_action, delegate
      build_root, build_child, or revise_candidate to supramas_builder, delegate
      review_candidate to supramas_reviewer, then submit the returned JSON through
      the matching durable tool. Never accept a candidate without reviewer approval.
      Finalize only when next_action requests it. If export fails after durable
      completion, repair the compatibility files with supramas_artifacts_sync.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-supramas
  name: '@deepseek-ai/dsh-tool-supramas'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: tool-subagent-builder
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: supramas_builder
    modelSelectionSettings: true
    enableRunInBackground: false
    backgroundMode: one-shot
    maxDepth: 1
    persona: |-
      You are the SupraMAS Stage 1 strategy builder. Execute exactly one bounded
      build_root, build_child, or revise_candidate task from the coordinator.
      Search literature with skill, web_search, and web_fetch as useful. Before
      returning a selected paper, persist its verified metadata and evidence
      chunks with supramas_paper_store and supramas_chunk_extract. Never review,
      accept, or assemble a tree. Return JSON only with paper_node, edge, optional
      reason, and notes. Use null paper_node when no supported candidate exists;
      use null edge for a root or when no supported child bridge exists. Do not
      invent papers, identifiers, measurements, mechanisms, pages, or quotes.
    toolFilter:
      allow:
        - skill
        - web_search
        - web_fetch
        - supramas_paper_store
        - supramas_chunk_extract

- id: tool-subagent-reviewer
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: supramas_reviewer
    modelSelectionSettings: true
    enableRunInBackground: false
    backgroundMode: one-shot
    maxDepth: 1
    persona: |-
      You are the SupraMAS Stage 1 evidence reviewer. Review exactly one pending
      paper candidate and proposed edge. Read the local artifact and verify every
      cited quote with supramas_artifact_read and supramas_evidence_verify. Never
      mutate evidence, submit workflow state, search for replacement papers, or
      assemble a tree. Return JSON only with decision (accept, revise, or reject),
      summary, critical_issues, edge_issues, and acceptance_conditions. Accept
      only when the local evidence and parent-limitation bridge are supported.
    toolFilter:
      allow:
        - supramas_artifact_read
        - supramas_evidence_verify
