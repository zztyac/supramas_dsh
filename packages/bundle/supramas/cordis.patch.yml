# SupraMAS is a host capability extension; model tools mount only inside the SupraMAS preset.
- insert:
    - id: supramas-runtime
      name: '@deepseek-ai/dsh-supramas'
    - id: supramas-artifacts
      name: '@deepseek-ai/dsh-supramas-artifacts'
      config:
        root: !!js process.cwd()
    - id: supramas-literature
      name: '@deepseek-ai/dsh-supramas-literature'
    - id: supramas-literature-openalex
      name: '@deepseek-ai/dsh-supramas-literature-openalex'
    - id: supramas-paper-http
      name: '@deepseek-ai/dsh-supramas-paper-http'
    - id: supramas-pdf-pypdf
      name: '@deepseek-ai/dsh-supramas-pdf-pypdf'
    - id: supramas-paper-ingest
      name: '@deepseek-ai/dsh-supramas-paper-ingest'
    - id: api-supramas
      name: '@deepseek-ai/dsh-api-supramas'
    - id: client-ui-supramas
      name: '@deepseek-ai/dsh-client-ui-supramas'
